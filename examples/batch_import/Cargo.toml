[package]
name = "batch_import"
version = "0.1.0"
edition = "2021"

[dependencies]
taibai = { path = "../.." }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
chrono = "0.4"

[[bin]]
name = "batch_import"
path = "src/main.rs"
