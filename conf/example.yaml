server:
  host: "0.0.0.0"
  port: 5151
  max_connections: 1024
  max_concurrent_requests: 8
  # 为 bulk 写入保留的重请求槽位数：查询类请求最多占用
  # max_concurrent_requests - reserved_bulk_slots 个槽，保证查询压满服务端时
  # bulk 导入仍有槽位可提交，不会因排队超时被过载拒绝。0 关闭保留
  reserved_bulk_slots: 2
  # 列式批量导入消息（0x23）的接收上限；批量导入的载荷随批次行数增长，
  # 因此独立于通用 max_message_size
  max_bulk_message_size: 134217728
  # 重请求等待执行槽位的最长时间，超时返回 overload 错误而不是静默排队
  request_queue_timeout_secs: 30
  # 单条协议消息的收发上限，同时决定查询结果集的服务端缓冲上限：
  # 结果集上限 = min(buffer.query_memory_limit_mb / 2, max_message_size / 2)，
  # 默认配置下即 32 MB。结果超限报 "query result exceeded memory limit"，
  # 属确定性错误（同数据重试必然复现），内置客户端不会自动重试。
  # 需要 >64MB 结果集时会话内执行 SET streaming_results = true 启用分块
  # 流式结果（不受本上限约束，见 docs/user-guide/query-management.md）；
  # 直接调大本值则必须同步调大所有客户端的接收上限（内置客户端与
  # JDBC 客户端均硬编码 64 MB），否则大结果会在客户端解码阶段报协议错误。
  max_message_size: 67108864

storage:
  # 数据目录；生产部署应改为独立的持久化目录
  data_dir: "./data"
  default_database: "main"
  min_segment_seal_size_mb: 500
  max_segment_size_mb: 2048
  hot_store_memory_limit_mb: 8192
  # 未满一个 row group 的已提交数据驻留 memtable/durable tail；该值同时决定
  # memtable 滚动阈值（max_rows_per_memtable）。大批量导入场景调大可减少
  # row group 数量、tail 滚动次数与元数据开销（代价是未刷盘驻留内存上限升高，
  # spill 机制会在内存压力下自动释放冷 memtable）。
  row_group_target_rows: 65536
  # reader 与 segment 元数据缓存的 segment 数量
  reader_cache_capacity: 1024
  # 等待表级 mutation lock 的最长时间（秒），超时返回锁超时错误而不是永久阻塞
  mutation_lock_timeout_secs: 60
  # 加锁等待超过该阈值时输出 warn 日志，暴露锁排队
  mutation_lock_warn_secs: 1
  # 等待 durable tail group commit（fsync）确认的最长时间
  tail_commit_timeout_secs: 120
  # fsync 或 commit 确认超过该阈值时输出 warn 日志，暴露慢盘
  tail_commit_warn_secs: 2
  # ACK 分级：false=ACK_ON_FSYNC（默认，fsync 落盘后应答，崩溃零丢失）；
  # true=ACK_ON_WAL（写入 page cache 即应答，延迟最低，但机器掉电可能丢失
  # 最近一批已应答数据）。测试/导入环境可用 true 换取吞吐，生产保持 false
  tail_async_fsync: false
  # 清理 memtable tail 日志时归档而非删除（存放在 <data>/wal_archive/<db>/<table>/，
  # 作为 PITR 与复制引导的增量日志源）。默认 false 保持原有删除行为（不增加磁盘占用）
  tail_archive: false

# 主备复制（可选）：role = none | primary | standby。
# primary 发布物理操作流（拒绝 bulk/RELAXED 写入）；standby 只读、
# 从 primary_addr 拉取事件流，本地调度与自动压缩关闭。
# 引导方式：停主库 → backup 工具备份 → 备库以备份目录启动 → 自动续传。
replication:
  role: none
  primary_addr: 127.0.0.1:5151
  user: root
  password: taibai
  ring_capacity: 65536

buffer:
  query_memory_limit_mb: 4096
  execution_threads: 8
  max_parallel_row_groups: 8
  global_io_permits: 4
  global_cpu_permits: 8

compression:
  enabled: true
  # bulk segment 写入的 zstd 压缩级别（1..=22，启动时截断）。
  # 这是所有表的默认级别；建表时可用 COMPRESSION_LEVEL = n 按表覆盖
  # （如归档表 COMPRESSION_LEVEL = 19，热表 COMPRESSION_LEVEL = 1），
  # 也可用 ALTER TABLE ... SET COMPRESSION_LEVEL = n | DEFAULT 修改。
  bulk_zstd_level: 3

# 变更订阅（pubsub）：客户端通过 SUBSCRIBE 协议消息订阅表的插入变更，
# 服务端异步推送带序号的通知。默认开启，但没有订阅者时写入路径只做一次
# 原子读，几乎零开销。所有队列都有界，慢消费者只丢通知（有计数）不阻塞写入。
pubsub:
  enabled: true
  # 写入线程 -> 扇出线程的事件通道容量；打满时丢弃事件并计数
  event_channel_capacity: 65536
  # 全局最大订阅数
  max_subscriptions: 1024
  # 每个连接的通知队列容量；客户端消费不过时超额通知被丢弃并计数
  notification_channel_capacity: 1024

log:
  level: "info"
  # 输出 [insert-profile] 逐阶段 INSERT 诊断日志
  insert_profile: false
