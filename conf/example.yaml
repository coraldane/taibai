server:
  host: "0.0.0.0"
  port: 5151
  max_connections: 1024
  max_concurrent_requests: 8

storage:
  data_dir: "./data"
  default_database: "main"
  min_segment_seal_size_mb: 500
  max_segment_size_mb: 2048
  hot_store_memory_limit_mb: 8192

buffer:
  query_memory_limit_mb: 4096
  execution_threads: 8
  max_parallel_row_groups: 8
  global_io_permits: 4
  global_cpu_permits: 8

compression:
  enabled: true

log:
  level: "info"
