server:
  host: "0.0.0.0"
  port: 5151
  max_connections: 1024
  max_concurrent_requests: 8

storage:
  # data_dir: "./data"
  data_dir: "/Users/coral/Downloads/data/taibai_data"
  default_database: "main"
  min_segment_seal_size_mb: 500
  max_segment_size_mb: 2048
  hot_store_memory_limit_mb: 8192
  # 未满一个 row group 的已提交数据驻留 memtable/durable tail；该值同时决定
  # memtable 滚动阈值（max_rows_per_memtable）。大批量导入场景调大可减少
  # row group 数量、tail 滚动次数与元数据开销（代价是未刷盘驻留内存上限升高，
  # spill 机制会在内存压力下自动释放冷 memtable）。
  row_group_target_rows: 65536
  # reader 与 segment 元数据缓存的 segment 数量
  reader_cache_capacity: 1024

buffer:
  query_memory_limit_mb: 4096
  execution_threads: 8
  max_parallel_row_groups: 8
  global_io_permits: 4
  global_cpu_permits: 8

compression:
  enabled: true
  # bulk segment 写入的 zstd 压缩级别（1..=22，启动时截断）
  bulk_zstd_level: 3

log:
  level: "info"
  # 输出 [insert-profile] 逐阶段 INSERT 诊断日志
  insert_profile: false
