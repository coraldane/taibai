server:
  host: "0.0.0.0"
  port: 5152
  max_connections: 1024
  max_concurrent_requests: 16

storage:
  data_dir: "E:/data/taibai_data"
  # data_dir: "../data"
  default_database: "main"
  min_segment_seal_size_mb: 500
  max_segment_size_mb: 2048
  hot_store_memory_limit_mb: 8192
  row_group_target_rows: 65536
  reader_cache_capacity: 1024
  mutable_reader_cache_mb: 4096

buffer:
  query_memory_limit_mb: 4096
  execution_threads: 16
  max_parallel_row_groups: 8

compression:
  enabled: true
  # 全局默认 zstd 级别（1..=22）；建表时可用 COMPRESSION_LEVEL = n 按表覆盖
  bulk_zstd_level: 3

log:
  level: "info"
  file: "../logs/taibai.log"
  insert_profile: false
