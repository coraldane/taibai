[workspace]
members = [
    ".",
    "examples/batch_import",
    "examples/multi_insert",
    "examples/prepare_test",
    "examples/hot_insert",
]

[package]
name = "taibai"
version = "0.1.8"
edition = "2021"
autotests = false
description = "An experimental Rust columnar database server for analytical workloads"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["database", "columnar", "analytics", "sql"]
categories = ["database-implementations"]

[lib]
name = "taibai"
path = "src/lib.rs"

[[bin]]
name = "taibai"
path = "src/main.rs"

[[bin]]
name = "segment"
path = "src/bin/segment_checker.rs"



[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
rustls = "0.23"
futures = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
crc32fast = "1.4"
memmap2 = "0.9"
zstd = "0.13"
flate2 = "1"
rustls-pemfile = "2"
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"
lazy_static = "1.4"
rayon = "1.10"
chrono = "0.4"
windows-service = "0.7"
csv = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
chrono = "0.4"

