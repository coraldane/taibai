name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Test
        run: |
          set -o pipefail
          if cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log; then
            exit 0
          fi
          # Surface which tests failed as a check annotation: the job log is
          # not readable without admin rights, and "exit code 101" alone says
          # nothing about what broke.
          {
            echo "### 失败的测试用例"
            grep -E '^test .* FAILED$|^error: [0-9]+ targets? failed' test-output.log \
              | sort -u | head -20
            echo "### 断言详情"
            grep -A10 -E '^---- .* stdout ----' test-output.log | head -80 || true
          } > failing.txt
          echo "::error title=Test failures::$(tr '\n' ' ' < failing.txt | cut -c1-3000)"
          exit 1
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
