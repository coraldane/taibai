server:
  host: "0.0.0.0"
  port: 5151
  max_message_size: 67108864
storage:
  data_dir: "../data"
  default_database: "main"
  flush_threshold_rows: 65536
  min_segment_seal_size_mb: 500
buffer:
  batch_size: 4096
compression:
  enabled: true
tls:
  enabled: false
  cert_path: ""
  key_path: ""
auto_compact:
  enabled: true
  check_interval_secs: 60
  idle_threshold_secs: 30
  min_segments: 4
  min_deleted_rows: 100000
  max_tables_per_run: 1
log:
  level: "info"
  file: "../logs/taibai.log"
